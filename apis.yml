name: Gixo
description: 'Gixo was a consumer live-streaming fitness startup (coached, real-time running
  and workout classes delivered to a mobile app), surfaced as a portfolio company of
  Cowboy Ventures and added to the API Evangelist network as an enrichment lead. The
  enrichment pipeline probed the company on 2026-07-19 and found no live provider surface:
  gixo.com and www.gixo.com both HTTP 301-redirect to www.bodi.com (a Beachbody / BODi
  property), consistent with Gixo having been acquired and wound down into the Openfit
  / Beachbody / BODi fitness platform. No api.gixo.com or developer.gixo.com host resolves
  in DNS, and no /.well-known/ discovery surface, developer portal, documentation, SDKs,
  or public API is published. There is no API program to enrich; this profile is retained
  as a historical consumer-sector lead rather than an active provider.'
